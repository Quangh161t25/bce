<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Chụp Ảnh Hàng Hoàn - Shopee Quản Lý SP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      background: #0369a1;
      color: #e0f2fe;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .select-cam {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      max-width: 170px;
    }
    .video-container {
      position: relative;
      flex: 1;
      margin: 10px 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .status-msg {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      max-width: 80%;
      border: 1px solid #475569;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
      flex-wrap: wrap;
    }
    .input-order {
      padding: 7px 10px;
      font-size: 12px;
      background: #1e293b;
      color: white;
      border: 1px solid #475569;
      border-radius: 6px;
      width: 180px;
    }
    .btn-snap {
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 700;
      background: #ef4444;
      color: white;
      border: 2px solid white;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-snap:hover {
      background: #dc2626;
      transform: scale(1.03);
    }
    .btn-snap:active {
      transform: scale(0.97);
    }
    .btn-tool {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      background: #334155;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-tool:hover { background: #475569; }
    .recent-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0 4px 0;
      border-top: 1px solid #334155;
      min-height: 56px;
      align-items: center;
    }
    .snap-thumb {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      border: 1.5px solid #38bdf8;
      object-fit: cover;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>📸 Camera Hàng Hoàn <span class="badge" id="snap-count">0 ảnh</span></h1>
    <div style="display: flex; gap: 6px; align-items: center;">
      <select id="select-cam" class="select-cam"></select>
      <button id="btn-mirror" class="btn-tool" title="Lật gương camera">↔️ Lật</button>
      <button id="btn-pick-file" class="btn-tool" style="background: #0284c7;" title="Chọn file ảnh từ máy">📁 File</button>
      <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
    </div>
  </header>

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash" class="flash-overlay"></div>
    <div id="status-msg" class="status-msg" style="display: none;">Đang khởi động camera...</div>
  </div>

  <div class="controls">
    <input type="text" id="order-input" class="input-order" placeholder="Mã đơn / Vận đơn (tùy chọn)...">
    <button id="btn-snap" class="btn-snap">🔘 CHỤP ẢNH</button>
    <button id="btn-close" class="btn-tool" style="background: #64748b;">Đóng</button>
  </div>

  <div id="recent-strip" class="recent-strip">
    <span style="font-size: 11px; color: #94a3b8; font-style: italic;">Ảnh vừa chụp:</span>
  </div>

  <script>
    (function() {
      const video = document.getElementById('video');
      const selectCam = document.getElementById('select-cam');
      const btnSnap = document.getElementById('btn-snap');
      const btnMirror = document.getElementById('btn-mirror');
      const btnClose = document.getElementById('btn-close');
      const btnPickFile = document.getElementById('btn-pick-file');
      const fileInput = document.getElementById('file-input');
      const orderInput = document.getElementById('order-input');
      const flash = document.getElementById('flash');
      const statusMsg = document.getElementById('status-msg');
      const recentStrip = document.getElementById('recent-strip');
      const snapCount = document.getElementById('snap-count');

      let currentStream = null;
      let isMirrored = false;
      let capturedItems = [];

      // Lấy query param mã đơn hàng (nếu truyền vào từ URL: camera.html?orderId=...)
      const urlParams = new URLSearchParams(window.location.search);
      const paramOrderId = urlParams.get('orderId') || '';
      if (paramOrderId) orderInput.value = paramOrderId;

      function showStatus(text) {
        statusMsg.textContent = text;
        statusMsg.style.display = 'block';
      }
      function hideStatus() {
        statusMsg.style.display = 'none';
      }

      async function initCamera(deviceId) {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        showStatus('Đang kết nối camera...');

        const constraints = {
          video: deviceId 
            ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
            : { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        };

        try {
          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;
          video.play();
          hideStatus();
          await loadDevices();
        } catch (err) {
          console.warn('Fallback standard camera:', err);
          try {
            currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = currentStream;
            video.play();
            hideStatus();
            await loadDevices();
          } catch (err2) {
            console.error('Lỗi camera:', err2);
            showStatus('Không thể mở Camera: ' + (err2.message || 'Lỗi quyền truy cập'));
          }
        }
      }

      async function loadDevices() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevs = devices.filter(d => d.kind === 'videoinput');
          selectCam.innerHTML = '';
          videoDevs.forEach((dev, idx) => {
            const opt = document.createElement('option');
            opt.value = dev.deviceId;
            opt.textContent = dev.label || `Camera ${idx + 1}`;
            selectCam.appendChild(opt);
          });
          selectCam.style.display = videoDevs.length > 1 ? 'inline-block' : 'none';
        } catch (e) {}
      }

      selectCam.addEventListener('change', () => {
        initCamera(selectCam.value);
      });

      btnMirror.addEventListener('click', () => {
        isMirrored = !isMirrored;
        video.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
      });

      function compressImage(source, maxWidth = 1280, maxHeight = 1280, quality = 0.85) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = source;
        });
      }

      async function savePhoto(photoObj) {
        capturedItems.push(photoObj);
        snapCount.textContent = `${capturedItems.length} ảnh`;

        // Thêm vào recent strip
        const imgEl = document.createElement('img');
        imgEl.src = photoObj.dataUrl;
        imgEl.className = 'snap-thumb';
        imgEl.title = `Ảnh: ${photoObj.orderId || 'Tự do'} (${new Date(photoObj.createdAt).toLocaleTimeString()})`;
        recentStrip.appendChild(imgEl);

        // Lưu vào chrome.storage.local
        try {
          const res = await chrome.storage.local.get(['hangHoanPhotos']);
          const list = Array.isArray(res?.hangHoanPhotos) ? res.hangHoanPhotos : [];
          list.unshift(photoObj);
          await chrome.storage.local.set({ hangHoanPhotos: list });
        } catch (e) {
          console.error('Lỗi lưu storage:', e);
        }
      }

      btnSnap.addEventListener('click', async () => {
        if (!video.videoWidth) {
          alert('Camera chưa sẵn sàng!');
          return;
        }

        // Flash effect
        flash.style.opacity = '0.7';
        setTimeout(() => { flash.style.opacity = '0'; }, 120);

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        if (isMirrored) {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const rawUrl = canvas.toDataURL('image/jpeg', 0.88);
        const compressedUrl = await compressImage(rawUrl, 1280, 1280, 0.85);

        const targetOrder = orderInput.value.trim();
        const photoObj = {
          id: 'hh_img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          orderId: targetOrder,
          dataUrl: compressedUrl,
          fileName: `snap_${targetOrder ? targetOrder + '_' : ''}${Date.now()}.jpg`,
          createdAt: Date.now(),
          source: 'camera'
        };

        await savePhoto(photoObj);
      });

      btnPickFile.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const targetOrder = orderInput.value.trim();

        for (const f of files) {
          const reader = new FileReader();
          reader.onload = async (ev) => {
            const compressed = await compressImage(ev.target.result, 1280, 1280, 0.85);
            await savePhoto({
              id: 'hh_img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
              orderId: targetOrder,
              dataUrl: compressed,
              fileName: f.name || `file_${Date.now()}.jpg`,
              createdAt: Date.now(),
              source: 'file'
            });
          };
          reader.readAsDataURL(f);
        }
        fileInput.value = '';
      });

      btnClose.addEventListener('click', () => {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        window.close();
      });

      // Bắt đầu camera
      initCamera();
    })();
  </script>
</body>
</html>
